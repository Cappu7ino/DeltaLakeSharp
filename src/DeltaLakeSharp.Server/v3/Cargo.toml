[package]
name = "delta-table-service-v3"
version = "0.1.0"
edition = "2024"
description = "Delta Table Service V3 — native Rust Delta/DataFusion core with in-process C ABI"
publish = false

[lib]
name = "delta_table_service_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "delta-table-service-v3-fixture"
path = "src/fixture_cli.rs"

[dependencies]
# Arrow / FFI
# Keep Arrow aligned with DataFusion's Arrow dependency to avoid arrow-schema version splits.
arrow-flight = "59"
arrow = { version = "59", features = ["ipc", "ffi"] }
# URL parsing (required by delta-rs open_table APIs)
url = "2"
tonic = "0.14"
prost = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Delta Lake + query engine
deltalake = { version = "0.32.1", features = ["datafusion", "azure"] }
datafusion = "54"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
