[package]
name = "delta-table-service-v3"
version = "0.1.0"
edition = "2024"
description = "Delta Table Service V3 — native Rust Delta/DataFusion core with legacy Arrow Flight compatibility"
publish = false

[lib]
name = "delta_table_service_v3"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "delta-table-service-v3"
path = "src/main.rs"

[dependencies]
# Arrow Flight + gRPC
# Pin to 57 to match datafusion 52's arrow dependency (avoids arrow-schema version split).
arrow-flight = "57"
arrow = { version = "57", features = ["ipc", "ffi"] }
# URL parsing (required by delta-rs open_table APIs)
url = "2"
tonic = "0.14"
prost = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Delta Lake + query engine
deltalake = { version = "0.31", features = ["datafusion"] }
datafusion = "52"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
